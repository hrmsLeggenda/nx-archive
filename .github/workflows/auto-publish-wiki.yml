name: Auto publish wiki edits
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
concurrency:
  group: wiki-auto-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'work/wiki-web/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/github-script@v8
        with:
          script: |
            const {publish}=await import('${{ github.workspace }}/scripts/auto-publish-wiki.mjs');
            await publish({github,context,core});
