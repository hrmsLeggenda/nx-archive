name: CI
on:
  pull_request:
  push:
    branches: ['work/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/verify-fwe-entries.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/fwe-browser.mjs
      - run: node tests/wiki-shell-browser.mjs
      - run: node tests/wiki-entries-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwe-mobile-review
          path: |
            fwe-mobile.png
            wiki-shell-mobile.png
            wiki-entries-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-preview
          path: docs/.vitepress/dist
